# ペインクラスタ(Blind Pain Research)
# 注: 製品フィット評価はこの段階では行わない(product_fitフィールドは意図的に無い)

clusters:
  - id: pc-01
    name: 情報散在と「探す時間」の恒常的損失
    description: >
      情報がGoogle Drive/Slack/wiki/Box/基幹系など複数のSaaSに分散し、
      「どのツールに目的の情報があるのか分からない」状態が常態化。
      検索しても自己解決できず、探す行為自体が毎日の固定費になっている。
    evidence_refs: [ev-p01, ev-p03, ev-p12, ev-p25, ev-p26]
    frequency_signal: >
      毎日発生する性質のペイン。ベンダー調査だが「平均1時間5分/日」「自己解決できない77%」(ev-p01)。
      Slackの情報流失は2019年から語られる定番テーマ(ev-p26)で、大手事例(Sansan)でも導入前の中心課題(ev-p12)。
    severity_signal: >
      ストレス69.9%、情報が見つからないことによるトラブル経験・認知36.8%(ev-p03)。
      時間損失に加え手戻り・ミスに接続。ただし「業務が止まる」級の切迫性の証言は少なく、慢性痛型。
    who_feels: 一般社員全員(特に中途入社者・リモートワーカー)、探しものの割り込みを受ける有識者
    who_buys: 情報共有基盤を所管する情シス部門長・DX/業務改革推進部門(全社生産性のKPIを持つ層)
    current_workarounds:
      - 時間をかけて探す/あきらめて人に聞く
      - ツールの一元化(Notion等への集約)
      - フロー/ストック分離ルールと転記運用
      - 社内wiki・FAQの新設(ただし形骸化しがち: ev-p25)
    counterevidence:
      - Notionへの一元化+単一ツールのAIで「探す時間」をほぼ解消したと語る事例があり(ev-p12)、
        横断的な仕組みがなくても集約戦略で足りる組織が存在する。
      - 数値の主要な出典が検索製品ベンダーの調査(ev-p01)であり、中立調査での追認は本調査では未確認。
    evidence_strength: medium

  - id: pc-02
    name: 「結局人に聞く」文化と問い合わせ負担の集中
    description: >
      検索で見つからないときの標準回避策が「人に聞く」であり、
      質問が上司・同僚・関連部署・情シスに割り込みとして集中する。
      有識者への依存は属人化を温存し、退職・異動でナレッジが失われる。
    evidence_refs: [ev-p02, ev-p18, ev-p20, ev-p22]
    frequency_signal: >
      見つからない場合の70.8%が上司・同僚へ、59.8%が関連部署へ問い合わせ(ev-p02)。
      情シス側では問い合わせ対応が恒常的な負担として語られ、削減率(35%減等)が導入成果の言葉になっている(ev-p18)。
    severity_signal: >
      情シスの最大ストレスは「丸投げ」52.1%(ev-p20)で、問い合わせ・対応集中は疲弊・離職文脈で語られる。
      小規模企業でも「人に聞いたほうが一番早い」が施策の出発点になる程度には自覚されている(ev-p22)。
    who_feels: 質問を受ける有識者・ベテラン、情シス/ヘルプデスク担当、答えを待つ質問者本人
    who_buys: 情シス部門長(ヘルプデスク工数削減)、経営企画/人事(オンボーディング効率)
    current_workarounds:
      - FAQ・マニュアル整備(メンテが続かず陳腐化しがち)
      - ヘルプデスクのアウトソーシング
      - 社内ChatGPT/チャットボットの内製(ev-p22)
    counterevidence:
      - 「人に聞く」は最速で正確な手段として機能している側面があり、当事者が必ずしも問題視していない。
        「AIがあればサポートデスクは不要になる」という期待は実務検証者から「幻想」と明言されている(ev-p14)。
    evidence_strength: medium

  - id: pc-03
    name: 経営の「AI活用せよ」号令と情シスへの丸投げ・PoC止まり
    description: >
      国際比較・他社比較の焦りから経営が生成AI活用を号令するが、実行は情シス/DX部門に丸投げされる。
      試験導入(PoC)には至るが、セキュリティ・既存業務への統合・効果実証の壁で全社展開に進めず、
      「PoC止まり」「導入したが使われない」が大量発生している。
    evidence_refs: [ev-p17, ev-p20, ev-p23, ev-p24]
    frequency_signal: >
      生成AI試験導入89%に対し全社展開15%(グローバル調査, ev-p17)。国内でも利用45.0%のうち
      全社的推奨は15.9%にとどまる(JIPDEC, ev-p23)。活用方針はあるが実利用が伴わない構造(ev-p24)。
    severity_signal: >
      情シスの最大ストレスが「丸投げ」52.1%、事業部門導入ツールのトラブル丸投げ約8割(ev-p20)。
      推進責任と統制責任を同時に負う立場の疲弊が定量化されている。
    who_feels: 情シス/DX推進担当(実装・統制・説明責任)、期待した成果が出ず梯子を外される推進リーダー
    who_buys: CTO/CIO/情シス部門長。ただし予算の号令元は経営層であり、「経営に見せられる成果」が購買の言葉になる
    current_workarounds:
      - 小さく部門限定でPoCを回し続ける(PoC貧乏)
      - 汎用チャット(社内ChatGPT)配布で「導入した」実績を作る
      - 外部コンサル・SIerへの依頼
    counterevidence:
      - JIPDECでは日常業務(メール文・資料作成等)では80%超の企業が生成AIの利用成果を認識しており、
        「社内データ連携を伴わない汎用利用」の範囲では既に満足している企業も多い(src-p18)。
    evidence_strength: high

  - id: pc-04
    name: 社内データ×AIの権限・漏洩リスク(「見えすぎ」問題)
    description: >
      社内データをAIに接続する際、元システムのアクセス権限がAI側で維持されず、
      権限外の情報(人事・給与・機密)が要約・回答として露出する「見えすぎ」リスク。
      素朴なRAG実装(全文書を1つのベクトルDBへ)や、SaaS連携の想定外の権限スコープで実際に事故が起きる。
    evidence_refs: [ev-p04, ev-p05, ev-p06, ev-p07, ev-p11, ev-p16, ev-p23, ev-p28]
    frequency_signal: >
      【skeptic-review指摘1により修正】「見えすぎ」(権限透過失敗による社内露出)そのものを測った
      買い手側定量データは本調査では未取得。JIPDEC 59.9%(ev-p23)は「入力した機密の外部漏えい」懸念、
      ソフトクリエイト52.9%→64.1%(ev-p04, ev-p28)は「社員のリテラシー事故」懸念であり、
      いずれも隣接する恐怖の代理指標としてのみ扱う(「見えすぎ」の規模を示す数値として引用しない)。
      「見えすぎ」固有の頻度シグナルは実装者コミュニティでの規範形成(「ザルRAG」という蔑称の定着、
      権限フィルタリングが定番論点であること: ev-p06, ev-p16)という定性的なもの。
    severity_signal: >
      実際にプライベートチャンネル/DMの内容がAI出力に混入した一次体験談あり(ev-p07。ただしn=1)。
      人事・給与情報の露出という具体的な事故シナリオが語られ(ev-p11)、1件でも起きれば
      プロジェクト停止・懲戒・信用失墜級のインパクト。実装側ではACLを効かせる構成自体が高難度(ev-p16)。
    who_feels: 情報セキュリティ担当・情シス(事故責任)、実装エンジニア(ACL連携の難所)、事故当事者の社員
    who_buys: CISO/情シス部門長/CTO。このクラスタは「買う人」自身の一次ペインであり、同時に他施策への拒否権にもなる
    current_workarounds:
      - 接続するデータを公開情報のみに限定する(価値も限定される)
      - メタデータフィルタリング/Pre-filteringの自前実装(ev-p06)
      - OAuthユーザー直接認証などクラウド製品の構成の作り込み(ev-p16)
      - 人手での事前データ分類・棚卸し
      - 導入自体の先送り・禁止
    counterevidence:
      - 権限問題が顕在化するのは「社内データを深く接続した」場合であり、汎用チャット利用に留まる企業では
        このペインは顕在化していない(pc-03のcounterevidence参照)。
      - Notion等の単一プラットフォーム内AIであれば既存権限が概ね継承され、問題を回避できるケースがある(ev-p12, ev-p14)。
    evidence_strength: >
      high(実在性: 一次体験談・実装難所の証言・実装者コミュニティの規範形成により、ペインの実在は確実)
      /ただし市場規模・購買駆動力としては unproven(買い手側の直接定量データ未取得。skeptic-review指摘1)。
      実在性と規模を区別すること。

  - id: pc-05
    name: 社内RAG/AI検索の精度・データ品質・運用保守の壁
    description: >
      RAGを導入しただけでは期待精度が出ない。誤答原因の主因はLLMではなく
      社内文書の不備・不足と検索精度であり、導入後にコンテンツ改善・インデックス鮮度維持・
      評価ログ分析という継続的な運用負担が発生する。内製には専任エンジニアが必要。
    evidence_refs: [ev-p08, ev-p09, ev-p10, ev-p15, ev-p21, ev-p27]
    frequency_signal: >
      「導入しただけでは精度が出ないケースが非常に多い」という実務者の一致した観察(ev-p08, ev-p15)。
      実運用組織の定量分析でBad評価の88%が文書不備+検索精度に起因(ev-p09)。
    severity_signal: >
      「むしろ嘘に自信満々で答えるようになった」(ev-p15)は信頼喪失→利用離脱に直結。
      運用体制構築を「技術導入以上に必要」と実践者が明言(ev-p10)。内製は形態素解析やチューニングまで
      踏み込む必要があり高スキル人材を継続投入(ev-p21)。
    who_feels: 構築・運用エンジニア、期待外れの回答を受け取る利用者、精度に説明責任を持つ推進担当
    who_buys: CTO/VPoE/情シス部門長(内製コストとの比較で外部ソリューションを検討する立場)
    current_workarounds:
      - ハイブリッド検索・リランキング・チャンク調整などの精度チューニング(ev-p21)
      - FAQ拡充・ドキュメント整備を先行させる(ev-p09)
      - 質問ログを文書改善に還元する運用ループ(ev-p27)
      - 検索結果の人手チェック(ev-p15)
    counterevidence:
      - 元データが整備されている領域(FAQ化済み等)では精度が出やすく、
        文書整備という地道な代替策で大きく改善する(ev-p09)。AI固有の問題は12%に過ぎなかった。
    evidence_strength: high

  - id: pc-06
    name: シャドーAI/シャドーITと「紙のルール」の統制不全
    description: >
      利用ルールを策定しても曖昧さゆえに現場で判断できず、社員が個人アカウントの
      生成AI(シャドーAI)や未許可SaaSに流れる。禁止では地下化するだけで、
      情シスは「公式に使える安全な環境」を用意しない限り統制できない。
    evidence_refs: [ev-p19, ev-p20, ev-p04, ev-p28]
    frequency_signal: >
      シャドーITは86.4%の企業に存在(ev-p20)。ルール形骸化の構造は導入支援実務者が
      繰り返し観察(ev-p19)。リテラシー事故への恐れは64.1%へ増加(ev-p28)。
    severity_signal: >
      機密情報が個人アカウント経由で外部サービスに入るリスクは監査・コンプライアンス上の重大事案。
      ただし顕在化した事故の一次証言は本調査では未取得(懸念ベースが中心)。
    who_feels: 情シス・情報セキュリティ担当(統制不能への不安)、ルールに迷う現場社員
    who_buys: 情シス部門長/CISO。「禁止ではなく公式環境の提供」が投資の理屈になる
    current_workarounds:
      - 利用ガイドライン策定・社員教育(形骸化しがち: ev-p19)
      - 社内ChatGPT等の公式環境を用意して移行させる
      - CASB/SaaS管理ツールでの検知・ブロック
    counterevidence:
      - ルールの具体化と教育だけで実害なく回っている組織の存在は否定できない
        (本調査ではシャドーAI起因の実害事例の一次証言は見つからなかった)。
    evidence_strength: medium
