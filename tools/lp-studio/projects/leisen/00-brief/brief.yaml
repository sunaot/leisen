project_name: "leisen(霊泉)製品LP"
conversion_action: "デザインパートナー/早期導入の相談申し込み(第一CTA)+ GitHubリポジトリ閲覧(第二CTA)"
primary_target: "従業員数百〜数千人規模の企業で、社内へのLLM/AI導入と情報基盤を担う責任者・実務者(情報システム部門長、CTO/VPoE、プラットフォーム/DevExエンジニア、情報セキュリティ担当)"
target_context: >
  社内ナレッジがGoogle Drive / Slack / GitHub / wiki / 社内DBなど10〜30種のソースに分散しており、
  「AIに社内のことを聞ける状態」を作りたい。一方で権限管理・情報漏洩・監査対応の懸念から
  RAG/全文インデックス型の導入に踏み切れない、または一度作った社内RAGが権限・運用問題で停滞している。
  SaaS型検索製品(Glean等)は価格・データ持ち出し・カスタマイズ性で稟議が通りにくい。
traffic_source: "unknown(想定: GitHub/技術記事/カンファレンス経由のオーガニック、導入支援側からの紹介リンク。広告運用は未定)"
ad_promise: "unknown(広告未運用のため。LP単体で自己完結する説得設計とする)"
market: "ja-JP"
primary_device: "desktop優先(B2B技術者・稟議担当の業務閲覧を想定)、375px以上レスポンシブ必須"
constraints:
  - "製品は実装前ゲート段階(T-000a/b/c)。顧客実績・性能数値・稼働実績は一切存在しないため、定量成果・導入ロゴ・testimonialはLPに使用しない(claim-ledger準拠)"
  - "OSS+シングルテナント導入モデル。SaaSではない(開発元はSaaS運営を行わない)"
  - "ライセンス(Apache-2.0推奨)・正式名称/商標・OSS公開時期は人間の意思決定待ち。LP上はプレースホルダ表記可"
  - "設計上の主張(認可委譲、監査、単一経路)は設計文書に根拠がある事実として記載可。ただし『実装済み』とは書かない"
open_questions:
  - "OSS公開時期と公開時点のライセンス最終決定(v2 §3.1、人間判断)"
  - "正式プロダクト名の商標確保(v2 §3.3)"
  - "広告・流入チャネル計画(未定。ad-to-LP整合の検証は流入設計後に実施)"
  - "デザインパートナー契約形態(無償支援と引き換えの要件・評価データ提供)"
