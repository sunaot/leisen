# Stage 4 — ポジショニング3案(実質的に異なる説得仮説)
# 制約: skeptic-review.md の8条件を遵守。各案に「対スイートAI反論処理」を必須スロットとして含む。
# 共通の対象外宣言: 単一スイート(M365/Google/Notion)にデータが収まっている企業はスイート内蔵AIで足りる可能性が高く、本製品の主対象ではない。

options:
  - option_id: positioning-a
    archetype: "Mechanism Differentiated(機構による差別化)"
    target: "情報セキュリティに拒否権がある組織の、社内AI導入責任者(情シス部門長・CTO・CISO)。複数SaaS(10〜30種)にナレッジが分散している数百〜数千人規模の企業"
    context: "経営のAI号令で社内データ×AIを検討・PoC中だが、権限逸脱(見えすぎ)への不安が本人と社内審査の両方で障壁になっている。または一度作った社内RAGで権限問題に直面した"
    pain_cluster: "pc-04(入口)、pc-03(背景トリガー)"
    evidence_strength_for_pain: "実在性high(一次体験談ev-p07、実装難所の証言ev-p06/p16、「ザルRAG」という規範形成)。購買規模は未実証(skeptic指摘1準拠: JIPDEC数値は引用しない)"
    category_frame: "権限透過型の社内ナレッジ検索基盤(AI検索製品の一種だが、権限の扱い方でカテゴリを再定義)"
    core_problem: "社内データをAIにつなぐと、元システムのアクセス権限がAI側で維持されず、権限外の情報が回答に混ざる。権限リストの複製・同期という実装が構造的に破綻するため、注意深く作っても事故る"
    promise: "権限の複製をやめ、検索のたびに本人の資格情報でソースに問い合わせる。だから権限外の情報は構造的に回答に載らない(※設計原則としての約束。逸脱ゼロの保証表現はclm-016で禁止)"
    unique_mechanism: "認可の完全委譲(独自権限モデルなし・ACL複製ゼロ・本人トークンでソースAPIを呼ぶ)+全呼び出し単一経路監査+カナリア文書による常時検証。fact-002/003/007/013"
    reason_to_believe:
      - "機構をアーキテクチャ図と不変条件として開示(宣言でなく検証可能な設計。カテゴリ内で機構開示は0/18: conv-05)"
      - "OSSでコードそのものを検証できる+シングルテナントで自社環境から出ない(clm-003)"
      - "『しないこと』の明示: ACLを複製しない・データを預からない・インデックスを持たずに始められる(ws-03)"
      - "設計上の限界も開示(回答10〜60秒、ソース接続の初回同意、精度はソース検索に依存: lim-002/003/004)→無欠点提示のカテゴリ慣習(ws-05)への反行"
    suite_ai_objection: "『M365 Copilot / Notion AIは権限を継承するのでは?』→ その通りで、単一スイート内ならそれが最適。問題は現実の社内ナレッジがDrive+Slack+GitHub+wiki+社内DBに分散していること(brief/fact-010)。スイートAIの権限継承はスイートの外に及ばず、横断させた瞬間に権限の翻訳問題が再発する。leisenは『横断』の場面の権限透過に特化する"
    category_elements_to_follow:
      - "学習不使用・データ主権の明示(ja-JP慣習conv-04。leisenはそもそもデータを預からないのでより強い形で言える)"
      - "コネクタ対応ソースの一覧提示(conv-01系。エージェントの探索対象を具体化)"
      - "技術ドキュメント・アーキテクチャへの導線(OSS慣習conv-06)"
    elements_to_differentiate:
      - "ヒーローで機構を語る(カテゴリは能力宣言型)"
      - "ロゴ・削減数値・認証バッジの三点セットを使わない(使えない制約を、機構開示+透明性という別の信頼様式に転換)"
      - "対象外条件の明示(単一スイートで足りる企業を正直に断る)"
    risks:
      - "機構の説明は認知負荷が高く、非技術の意思決定者には難しい(コピー開発で圧縮階層の設計が必須)"
      - "『見えすぎ』ペインの購買規模が未実証(実装者には確実に刺さるが、部門長層の規模は仮説)"
      - "ゼロ知名度でKeycloak型信頼構成が成立するかは未検証の賭け(skeptic指摘5)"
    evidence_refs: [ev-p06, ev-p07, ev-p11, ev-p16, ev-p17, obs-060, conv-04, conv-05, ws-01, ws-02, ws-03, ws-05, fact-002, fact-003, fact-007, fact-013]
    assumptions:
      - "権限機構を理解・評価できる読者(技術バックグラウンドあり)が意思決定に関与している"
      - "複数SaaS分散がターゲット企業で一般的(スタック異質性の定量データは未収集: skeptic指摘4)"
    testable_hypothesis: "権限機構を主役にしたヒーローは、能力宣言型ヒーローより、情シス/セキュリティ層の相談CVRとGitHub遷移率が高い(launch後にA/B or 流入セグメント別で計測)"

  - option_id: positioning-b
    archetype: "Category Reframe(PoC止まり問題の再定義)"
    target: "生成AI導入プロジェクトの推進責任者(情シス部門長・DX推進・CTO)。PoCは回したが全社展開に進めず、経営への説明に窮している層"
    context: "経営の号令で社内AI導入を任された(丸投げ52.1%: ev-p20)が、試験導入89%に対し全社展開15%(ev-p17)という業界状況の当事者。セキュリティ審査・効果実証・運用体制の3つの壁の前で停滞中"
    pain_cluster: "pc-03(入口)、pc-04/pc-05(展開を止める2枚の壁として)"
    evidence_strength_for_pain: "high(中立・大規模調査の裏付けあり: ev-p17, ev-p20, ev-p23の全社展開15.9%)"
    category_frame: "AI製品ではなく『社内AIを全社展開まで運ぶための導入方法論込みのOSS基盤』"
    core_problem: "社内AIがPoCで止まるのは、モデルの性能ではなく、権限・監査(セキュリティ審査を通らない)と運用(専任を張れない)の構造問題だから"
    promise: "セキュリティ審査に耐える構造(認可委譲・全件監査)と、小さく入れて実測で広げる導入プレイブックで、PoCの先へ進める"
    unique_mechanism: "権限透過アーキテクチャ+監査ログを投資判断データに使う証拠駆動ゲート(検索層OFFで開始→昇格判定レポートで拡張: fact-005/006)+導入プレイブック同梱(fact-016)"
    reason_to_believe:
      - "『インデックスなしで開始』は初期の可動部品と審査対象を最小化する(fact-005、ws-03)"
      - "全ツール呼び出しの監査ログが『使われているか・何が解決しないか』を経営に見せる材料になる(fact-003)"
      - "OSS+deployment.yaml 1枚の宣言的導入で、PoC→本番が同じ構成のまま進む(fact-009)"
    suite_ai_objection: "『まずCopilot有効化でよいのでは?』→ スイートAIの有効化は『導入した』実績にはなるが、スイート外のナレッジ(Slack/GitHub/社内DB)に届かず、監査データも残らないため『次に何を広げるべきか』の判断材料が出ない。leisenは展開判断の根拠(ソース別未解決率)を製品が吐く"
    category_elements_to_follow:
      - "導入ステップの明示(日本B2B慣習: 導入パターン提示はPKSHA等が採用)"
      - "FAQ節(稟議者の疑問応答)"
    elements_to_differentiate:
      - "『AIのすごさ』を売らない。展開が止まる構造問題への応答として登場(Slack AIの逆張り観察obs系・AI疲れと整合)"
      - "ロードマップ・ゲート基準という『進め方』を製品価値として見せる(ws-04)"
    risks:
      - "方法論訴求はコンサル的で抽象に流れやすく、製品の具体が伝わらない恐れ"
      - "『PoC止まり』の自覚がない(まだ着手前の)読者には刺さらない"
      - "導入プレイブックは現物がまだ薄く、過剰約束になりやすい(実装前ゲート段階)"
    evidence_refs: [ev-p17, ev-p20, ev-p23, ev-p24, ws-04, fact-003, fact-005, fact-006, fact-009, fact-016]
    assumptions:
      - "PoC停滞層が流入チャネルに存在する(検索・紹介経由を想定。未検証)"
      - "『証拠駆動で広げる』という進め方が、日本企業の稟議文化で価値として通じる"
    testable_hypothesis: "PoC止まり問題を入口にしたLPは、AI能力訴求LPより推進責任者層の資料/相談CVRが高い(流入セグメント別計測)"

  - option_id: positioning-c
    archetype: "Alternative-led(内製RAGとの対比)"
    target: "社内RAG/AI検索を内製した・している・しようとしているエンジニアリング組織(CTO/VPoE/プラットフォームエンジニア)。技術評価が購買の実質的関門になる企業"
    context: "ベクトルDB+RAGで社内検索を作ったが、権限フィルタの自前実装(『検索する前に権限で絞るのが正解』ev-p06)、インデックス鮮度の維持、精度チューニングの継続負担(ev-p21)に直面。または着手前にこれらの困難を調査中"
    pain_cluster: "pc-05(入口)、pc-04(内製の最難所として)"
    evidence_strength_for_pain: "high(実装者の一次記事が豊富: ev-p06, p08, p09, p15, p16, p21)"
    category_frame: "内製RAG基盤の代替となるOSSインフラ(Keycloakが認証で果たす役割の、社内AI検索版)"
    core_problem: "社内AI検索の内製で本当に難しいのは、LLMでもベクトル検索でもなく、権限(ACL連携)と運用(同期・鮮度・評価)。ここに高スキル人材が張り付き続ける"
    promise: "権限・監査・コネクタという『内製で一番つらい部分』を標準実装として提供する。インデックス同期なしで始まり、運用は専任1〜2名で回る設計"
    unique_mechanism: "MCP標準の統一IF(search/fetch/list/describe)+認可のソース委譲+単一経路監査+deployment.yaml宣言的構成(fact-002/003/004/009/011)"
    reason_to_believe:
      - "アーキテクチャと不変条件が公開されており、設計判断(ADR)まで読める(OSS慣習conv-06の透明性をコード以上に拡張)"
      - "インデックスを持たないPhase 1設計は、内製の運用負債(同期・鮮度・削除伝播)を構造的に回避(fact-005)"
      - "MCP準拠なので自社のエージェント/LLM製品からそのまま使える(fact-004。※product-derived hypothesisとして控えめに)"
      - "限界の明示(レイテンシ10〜60秒、ソース検索品質への依存)が技術評価者への信頼になる(ws-05仮説)"
    suite_ai_objection: "『Copilot/Notion AIでよくない?』→ 内製検討層はまさに『スイートに収まらないデータがある』からRAGを作っている。この層には対スイート反論はほぼ不要で、対抗馬は『自分で作る』。だからこの案の比較軸は build vs adopt"
    category_elements_to_follow:
      - "GitHub/ドキュメントへの直接導線、self-host訴求(conv-06)"
      - "技術スタック・アーキ図の提示(Keycloak/Elastic型)"
    elements_to_differentiate:
      - "『作るのをやめよう』ではなく『一番つらい部分だけ引き受ける』という分担の提示"
      - "削減数値の代わりに設計文書・不変条件を証明に使う"
    risks:
      - "対象が最も狭い(内製を検討する技術組織のみ)。デザインパートナー獲得には適するが、市場の広がりは限定的"
      - "エンジニアは自作を好むバイアスがあり、『自分ならもっとうまく作れる』反応を誘発しうる"
      - "公開前でstarsも実績もないOSSを本番採用する心理障壁(skeptic指摘5と同型)"
    evidence_refs: [ev-p06, ev-p08, ev-p09, ev-p15, ev-p16, ev-p21, conv-06, ws-03, ws-05, fact-002, fact-004, fact-005, fact-009, fact-011]
    assumptions:
      - "内製検討層が主要流入(GitHub・技術記事経由)と重なる"
      - "『権限と運用が内製の最難所』という問題認識を読者が既に持っている(教育不要)"
    testable_hypothesis: "build vs adopt比較を入口にしたLPは、技術者流入セグメントでGitHub遷移率・ドキュメント滞在が最も高い(計測で確認)"

# ---- 選定 ----
selection:
  selected: positioning-a
  rationale: >
    3案の説得起点は a=権限機構(なぜ事故らないか)、b=導入の進め方(なぜPoCで止まらないか)、c=内製との分担(なぜ作らなくてよいか)で実質的に異なる。
    aを選定する理由: (1) 入口ペインpc-04は「買う人自身の一次ペイン」かつ他施策への拒否権であり、ここを解かない限りbのストーリーも審査で止まる。
    (2) カテゴリ観察上の最大の空白(機構開示0/18)と製品の最強の事実(不変条件1/2)が正確に重なる。
    (3) 実績・数値が使えない制約下で、機構開示は唯一「今持っている本物」で証明できる主張。
    (4) LPの2つのCV(デザインパートナー相談=意思決定者、GitHub=技術者)の両方に同じ機構ストーリーで到達できる。
    bの「証拠駆動の段階導入」はaの下位セクション(導入の進め方)として、cの「内製との比較」はaの反論処理セクションとして吸収する。
    リスク管理: 機構訴求の認知負荷はStage 7のCopy Ladder(Plain Message優先、Brand Copyを目標にしない)で制御。
    購買規模の未実証はlaunch後の流入セグメント別計測(testable_hypothesis)で検証する。
  rejected_alternatives: "b: 単独では抽象化しやすくAI疲れ文脈で埋没リスク。c: 対象が狭くLPの主役には不足。いずれも要素としてaに統合"
  decided_by: "claude(autonomous run)— ユーザーはrevisit_stage.pyで差し戻し可能"
