# Stage 7 — Copy Development(ms-2 × arch-1 のヒーロー確定)
# 最適化目標: clarity × relevance × specificity × credibility ÷ cognitive load(短さ・スローガン性は目標にしない)

information_requirements:  # ファーストビューで初見訪問者に成立させるべき理解
  - {statement: "社内の複数ツールに散らばるナレッジを、AI(LLM)で横断検索できるようにする基盤である", priority: must}
  - {statement: "検索は質問者本人の権限で行われ、権限外の情報は回答に出てこない設計である", priority: must}
  - {statement: "アクセス権限のリストを複製・同期しない(判断は元のデータソースが下す)ことがその実現方法である", priority: must}
  - {statement: "OSSであり、自社環境に導入する。データを外部SaaSに預けない", priority: must}
  - {statement: "対象は Google Drive / Slack / GitHub / wiki 等が併存する企業(単一スイート完結の企業は対象外)", priority: helpful}
  - {statement: "早期段階のプロジェクトで、導入相談(デザインパートナー)を受け付けている", priority: helpful}
  - {statement: "回答には原典リンクが付く/すべての検索は監査ログに残る", priority: later}

reader_prior_knowledge:
  product: none        # 公開前。誰もleisenを知らない
  category: low        # 「社内AI検索」という括りの認知はts-1でlow、ts-2でmedium
  problem: medium      # 権限・漏洩の不安は広く共有(ts-1)。ts-2は機構レベルで理解(high)
  terminology: low     # 混合流入の下限に合わせる: ACL/MCP/RAG等の頭字語をヒーローで使わない。「権限」「データソース」までは可
# → 事前知識が低いため、ヒーローは明示的に。確立ブランドの情報密度(『年中無休のAIチーム』型)を模倣しない。
#    カテゴリ・行為・結果の具体アンカーを保持する(copy-development-policy)。

copy_ladder:
  product_truth: >
    leisen(霊泉)は、Google Drive・Slack・GitHub・wikiなど複数のデータソースに分散した社内ナレッジを、
    LLMが検索・参照できるようにするOSS基盤である。利用者がチャットで質問すると、LLMが適切なソースを選び、
    利用者本人の資格情報で各ソースのAPIを呼んで検索・閲覧し、原典リンク付きで回答する。
    アクセス可否の判断は常に元のデータソースが本人に対して下す。独自の権限モデルや、
    アクセス権限(ACL)の複製・同期は実装していない。全ツール呼び出しはGatewayの単一経路を通り、
    監査ログに記録される。ソフトウェアは各社が自社環境にシングルテナントで導入し、データを開発元や外部SaaSに預けない。
    現在は実装前ゲート段階であり、稼働実績はない。
  customer_value: >
    社員がAIに社内のことを聞ける環境を作っても、「権限外の情報が回答に混ざる」事故を構造的に起こしにくい。
    AIは質問した本人がアクセスできる範囲だけを検索して答えるため、権限リストをAI側に移し替える作業も、
    その同期が壊れて漏れる心配もない。すべての検索が監査ログに残るので、情報セキュリティ審査に
    説明可能な形で持ち込める。OSSかつ自社環境で動くため、データ持ち出しの懸念で稟議が止まらない。
    情報漏洩の不安で停滞していた社内AI活用を、統制と両立する形で前に進められる。
  plain_message: >
    見出し: 社内ナレッジのAI検索を、本人の権限のままで。
    補足: leisenは、散らばった社内情報をAIが横断検索するためのOSS基盤です。権限を複製せず、
    AIは質問した本人がアクセスできる情報だけを、元のデータソースに問い合わせて答えます。
  persuasive_copy: >
    見出し: 権限を複製しない。AIは、本人に見える情報だけで答える。
    (リズムのために2文構成へ。意味の欠落なし。「複製しない」という機構と「本人に見える情報だけ」という
    結果を1見出しに保持)
  brand_copy: >
    (検討したが不採用)「見える範囲で、すべて答える。」— 製品カテゴリ・対象・機構がすべて脱落し
    core_meaning_loss: high。事前知識noneの読者には回復不能。採用しない。
  compression_notes:
    - from: product_truth
      to: customer_value
      removed: ["MCP・Gateway等の実装用語", "シングルテナントという語(『自社環境で動く』に翻訳)", "実装前ゲート段階(ヒーロー外の『現在地』セクションで開示)"]
      core_meaning_loss: none
    - from: customer_value
      to: plain_message
      removed: ["監査ログ(サブヘッド外へ。情報要件では later)", "審査・稟議の文脈(問題セクションへ移動)", "事故の構造説明(第2セクションへ移動)"]
      core_meaning_loss: low
    - from: plain_message
      to: persuasive_copy
      removed: ["『社内ナレッジのAI検索』というカテゴリ名が見出しから外れる(→eyebrowとサブヘッドで回復)"]
      core_meaning_loss: low  # Hero Message Unit全体で回復することを条件に採用
    - from: persuasive_copy
      to: brand_copy
      removed: ["機構(複製しない)", "対象(社内ナレッジ)", "カテゴリ(AI検索基盤)"]
      core_meaning_loss: high  # 不採用

hero_message_unit:  # v2.1 — 監査1指摘を反映したv2で再監査合格後、監査2の削減指摘のみ反映(blind-audit.md参照)
  eyebrow: "社内ナレッジのAI検索基盤(OSS・自社環境で導入)"
  eyebrow_job: "カテゴリと提供形態のアンカー。※v1の『権限透過型』は監査1で逆読みリスク(権限を無視して全部見える)が指摘され、平易なカテゴリ名に変更。『権限透過』は本文中で定義してから使う"
  headline: "権限を複製しない。AIは、本人に見える情報だけで答える。"
  headline_job: "中核機構と、その利用者にとっての意味(結果)の提示。監査1で『後半が前半を救う』構造が確認できたため維持"
  subheadline: >
    leisen(霊泉)は、Google Drive・Slack・GitHub・wiki に散らばる社内ナレッジを、LLMが横断検索するための基盤です。
    社員はチャットとAPIから質問でき、検索はつねに質問者本人の権限で行われ、アクセスの可否は元のデータソースが判断します。
    オープンソースとして自社環境に導入でき、ナレッジのコピーを外部に蓄積しません。
  subheadline_job: >
    何の製品か/使い方の形(チャット・API: 監査1の『どのUIで使うのか不明』への応答)/機構の平文説明/導入形態の補完。
    v1の『データを外部に預けません』は『完全オンプレでAIが動く』という誤読余地が指摘されたため、
    範囲を明確化(コピーを外部に蓄積しない)。LLM API利用の事実はFAQで正直に開示する
  visual_job: >
    装飾ではなく機構の証明: 「質問 → Gateway(本人の資格情報・監査ログ) → 各データソースが可否を判断 → 原典リンク付き回答」
    の流れを示す簡潔なアーキテクチャ図。権限外ソースの遮断要素には「権限なし」のラベルを付す(監査1: 『非対応』との誤読防止)
  cta: "主: 『導入について相談する』(デザインパートナー文脈へ) / 副: 『設計ドキュメントを読む』(GitHub公開準備中はプレースホルダ表記)"
  cta_job: "意思決定者と技術者の2導線分岐。主CTAの重さはB2B慣習(conv-03)に対し軽め(資料DLを置けないため相談に一本化)"
  proof: >
    ロゴ・数値・認証は不使用(claim-ledger準拠)。代替として不変条件チップ3点を配置:
    「権限リストの複製・同期なし」「すべての検索を監査ログに記録」「自社環境で完結・他社と混ざりません」
    ※v1のACL/シングルテナントという頭字語・専門語は監査1指摘により平易化(terminology: low に整合)
  proof_job: "宣言ではなく設計規律の存在を示す(検証はGitHub導線に接続)"

# ブラインド5秒監査の結果は blind-audit.md に記録(監査エージェントにはこのファイルを渡さない)
