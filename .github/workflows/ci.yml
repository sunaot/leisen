name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm test
  # T-002: Keycloak参照実装のE2E。
  # 注意: このE2Eは「Keycloak発行トークンを受けるモックコネクタ」であり、
  # Drive/Slack等の実SaaS認可経路は検証しない(ADR-010、e2e/keycloak/README.md)。
  keycloak-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: docker compose -f e2e/keycloak/docker-compose.yml up -d
      - run: e2e/keycloak/wait-ready.sh
      - run: KEYCLOAK_E2E=1 npm test -w @kp/gateway
      - if: always()
        run: docker compose -f e2e/keycloak/docker-compose.yml down
  # T-012: リファレンスデプロイの起動確認。クリーンなCIコンテナで
  # gateway+keycloakをcompose起動し、smoke.sh(認可分岐とMCPセッション確立)を
  # 通す。
  reference-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f deploy/reference/docker-compose.yml up -d --build
      - run: deploy/reference/smoke.sh
      - if: always()
        run: docker compose -f deploy/reference/docker-compose.yml logs gateway
      - if: always()
        run: docker compose -f deploy/reference/docker-compose.yml down
