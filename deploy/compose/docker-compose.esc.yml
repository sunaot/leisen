# ESC 方式の overlay(ADR-022 / ADR-023、T-026)。基本の docker-compose.yml と LibreChat overlay
# (docker-compose.librechat.yml)にさらに重ね、LibreChat から ESC 方式で esa を使う評価用構成にする。
#
#   cd deploy/compose
#   docker compose -f docker-compose.yml -f docker-compose.librechat.yml -f docker-compose.esc.yml up -d --build --wait
#
# 手順・前提は docs/ui-librechat.md「1.8 ESC 方式で esa を使う」。
#
# 変えるもの:
#   gateway       設定を deployment.esc.yaml に差し替え(認可サーバー・esa の esc)、ESC の鍵・esa と
#                 LibreChat のクライアント secret を渡し、状態 DB のボリュームを足す
#   orchestrator  同じ設定を読み、受けたトークンを Gateway の /token で Gateway 宛てに交換する
#                 (--authorization-server / --public-url)
#   librechat     librechat.esc.yaml(MCP サーバー leisen を OAuth クライアントとして使う)に差し替え、
#                 Gateway に登録したクライアント secret を渡す
#
# 秘密は .env にだけ置く(不変条件6)。LEISEN_ESA_CLIENT_SECRET は esa に動的登録して得た値で、
# 雛形にはない(未設定なら起動しない)。

services:
  gateway:
    environment:
      # Gateway が封じるトークン(ESC・認可コード・state・ブラウザのセッション)の鍵。32 バイト
      LEISEN_ESC_KEY: ${LEISEN_ESC_KEY:?set it in deploy/compose/.env (openssl rand -base64 32)}
      # esa の OAuth クライアント secret(deployment.esc.yaml の connectors[esa].auth.oauth.clientSecretEnv)
      LEISEN_ESA_CLIENT_SECRET: ${LEISEN_ESA_CLIENT_SECRET:?set it in deploy/compose/.env (the client_secret from https://api.esa.io/oauth/dcr)}
      # 認可サーバーに登録した LibreChat のクライアント secret(librechat にも同じ値を渡す)
      LEISEN_LIBRECHAT_MCP_CLIENT_SECRET: ${LEISEN_LIBRECHAT_MCP_CLIENT_SECRET:?set it in deploy/compose/.env (cp .env.example .env)}
    volumes:
      # 基本の ./deployment.yaml と同じマウント先を上書きする
      - ./deployment.esc.yaml:/etc/leisen/deployment.yaml:ro
      # ESC の拒否リスト・使用済みの印(資格情報は置かない)。イメージが 1000:1000・0700 で用意する
      - leisen-credentials:/var/lib/leisen/credentials

  orchestrator:
    command:
      - serve
      - --gateway
      - http://gateway:8787/mcp
      - --config
      - /etc/leisen/deployment.yaml
      - --listen
      - 0.0.0.0:8790
      - --path
      - /mcp
      - --confirm-exposed-host
      - --max-concurrent-runs
      - "4"
      - --max-question-chars
      - "4000"
      - --llm
      - openai-compatible
      - --allow-insecure-upstream
      # Gateway の認可サーバー(ブラウザから見た発行者 = deployment.esc.yaml の publicBaseUrl)。
      # 交換先の受け手の既定は <これ>/mcp(Gateway の resource)。交換の要求は --gateway の
      # オリジン(http://gateway:8787/token)へ送る
      - --authorization-server
      - http://localhost:8787
      # この MCP の受け手(deployment.esc.yaml の authorizationServer.orchestratorResource)
      - --public-url
      - http://orchestrator:8790/mcp
    volumes:
      - ./deployment.esc.yaml:/etc/leisen/deployment.yaml:ro

  librechat:
    environment:
      LEISEN_LIBRECHAT_MCP_CLIENT_SECRET: ${LEISEN_LIBRECHAT_MCP_CLIENT_SECRET:?set it in deploy/compose/.env (cp .env.example .env)}
    volumes:
      - ./librechat/librechat.esc.yaml:/app/librechat.yaml:ro

volumes:
  leisen-credentials:
