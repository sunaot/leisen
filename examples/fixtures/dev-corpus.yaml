# 開発用コネクタ(kind: dev-fixture)の合成コーパス。
#
# examples/deployment.dev.yaml から settings.corpusFile で参照する。
# すべて架空の社内文書であり、実在の組織・人物・機密情報・秘密情報を含まない
# (URL は予約ドメイン example.test)。形式は packages/gateway/src/dev/fixture-connector.ts
# の documentSchema(id / title / content / url / container / author / updatedAt / scope)。
# scope(private / shared、省略時 shared)は ADR-016 追補2 の領域の分類で、
# privateScopes: excluded(既定)では private の文書を検索・一覧・fetch の対象から外す。
documents:
  - id: expense-rules
    title: 経費精算ルール(2026年度版)
    container: 総務
    author: 総務部
    updatedAt: "2026-04-01T09:00:00+09:00"
    url: https://intranet.example.test/docs/expense-rules
    content: |
      経費精算は、費用が発生した月の翌月10日までに経費精算システムから申請する。
      申請には領収書の画像を添付する。領収書のない支出(一部の交通費など)は、
      支払日・支払先・金額・目的を申請画面に記入する。
      承認の流れは「申請者 → 上長 → 経理担当」の順で、上長の承認から5営業日以内に
      経理担当が内容を確認し、翌月の給与と合わせて振り込む。
      交通費は最も合理的な経路の運賃で精算する。タクシーの利用は、深夜の帰宅や
      重い荷物の運搬など、やむを得ない場合に限る。
      会食費は事前に上長の承認を得る。参加者の所属と人数、目的を申請に記入する。
      不明点は総務部の問い合わせフォームから質問する。

  - id: vpn-setup
    title: 社外からのVPN接続手順
    container: 情報システム
    author: 情報システム部
    updatedAt: "2026-05-12T10:30:00+09:00"
    url: https://intranet.example.test/docs/vpn-setup
    content: |
      社外(自宅・出張先など)から社内システムを利用するときは、VPN に接続する。
      1. 貸与PCにインストール済みの VPN クライアントを起動する。
      2. 接続先に vpn.example.test を選ぶ(初期設定で登録済み)。
      3. 社内アカウントでサインインし、スマートフォンの認証アプリで多要素認証を承認する。
      4. 接続後、社内ポータルが開けることを確認する。
      公衆無線LANを利用する場合も、業務システムへのアクセスは必ず VPN 経由で行う。
      接続できないときは、クライアントを再起動してから情報システム部の
      ヘルプデスクへ連絡する。認証情報を問い合わせ票やチャットに書き込まない。

  - id: onboarding-guide
    title: 新入社員オンボーディングガイド
    container: 人事
    author: 人事部
    updatedAt: "2026-03-20T09:00:00+09:00"
    url: https://intranet.example.test/docs/onboarding-guide
    content: |
      入社初日は、貸与PCの受け取り、社内アカウントの有効化、社内ポータルの
      確認を行う。アカウントの初回サインインでは多要素認証の登録が必要になる。
      最初の1週間で、配属チームのメンターと面談し、チームの業務の進め方、
      会議体、ドキュメントの置き場所を確認する。
      入社から1か月以内に、情報セキュリティ研修とコンプライアンス研修を受講する。
      勤怠の打刻、経費精算、休暇申請の方法は、それぞれ人事部・総務部の手引きを参照する。
      困ったことがあれば、まずメンターに相談する。

  - id: meeting-bodies
    title: 社内会議体一覧と開催ルール
    container: 経営企画
    author: 経営企画室
    updatedAt: "2026-02-02T09:00:00+09:00"
    url: https://intranet.example.test/docs/meeting-bodies
    content: |
      主な会議体は次のとおり。
      - 経営会議: 毎週月曜。経営方針と重要案件を審議する。議事録は3営業日以内に共有する。
      - 部長会: 隔週水曜。部門間の調整事項と進捗を共有する。
      - 全社朝会: 毎月第1営業日。全社の方針と各部門のトピックを共有する。
      - 予算委員会: 四半期ごと。予算の執行状況と見直しを審議する。
      会議の議題は前日17時までに事務局へ提出する。資料は開催前に共有フォルダへ置き、
      会議後は決定事項と担当者を議事録に残す。

  - id: leave-request
    title: 休暇・休職の申請手続き
    container: 人事
    author: 人事部
    updatedAt: "2026-06-15T09:00:00+09:00"
    url: https://intranet.example.test/docs/leave-request
    content: |
      年次有給休暇は、原則として取得日の3営業日前までに勤怠システムから申請し、
      上長の承認を得る。急な体調不良の場合は、当日の始業時刻までに上長へ連絡し、
      事後に申請する。
      慶弔休暇・育児休業・介護休業などの特別休暇は、人事部の窓口で必要書類を確認する。
      休職を希望する場合は、上長と人事部に相談し、面談を経て手続きを進める。
      休暇の残日数は勤怠システムのマイページで確認できる。

  - id: incident-flow
    title: システム障害発生時の連絡フロー
    container: 情報システム
    author: 情報システム部
    updatedAt: "2026-07-01T09:00:00+09:00"
    url: https://intranet.example.test/docs/incident-flow
    content: |
      業務システムの障害に気づいたら、まず障害連絡チャンネルに第一報を投稿する。
      第一報には、発生時刻、影響を受けているシステム、症状、再現手順(分かる範囲)を書く。
      情報システム部の当番が受け付けて重大度を判定し、重大度が高い場合は
      障害対応チームを招集する。
      復旧後は、原因・影響範囲・再発防止策を障害報告書にまとめ、1週間以内に共有する。
      個人情報や認証情報が関係する場合は、情報セキュリティ委員会にも報告する。

  - id: wiki-writing-guide
    title: 社内Wikiの書き方ガイド
    container: ナレッジ
    author: ナレッジ推進チーム
    updatedAt: "2026-01-10T09:00:00+09:00"
    url: https://intranet.example.test/docs/wiki-writing-guide
    content: |
      社内Wikiのページは、最初の3行で「誰向けに・何が分かるか」を書く。
      手順は番号付きリストで書き、画面の名前やボタンの名前は実際の表記に合わせる。
      更新日と担当部署をページの末尾に記載し、古くなった手順には注意書きを付ける。
      検索で見つけやすいよう、よく使われる別名(例: VPN と リモート接続)を本文に含める。
      機密情報や認証情報はWikiに書かない。
