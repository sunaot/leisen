# 本人資格情報の 3 方式(ADR-022)と Gateway の MCP 認可サーバーを使う構成の例。
# 方式はソースごとに connectors[].auth.provider で選ぶ:
#   token_vault    … 接続ページ(/connections)で OAuth。更新トークンを Gateway が暗号化して保管
#   esc            … OAuth で得たトークンを Gateway の鍵で封じてクライアントが保持(Gateway は保管しない)。
#                    認可サーバー(gateway.authorizationServer.enabled)が要る
#   token_exchange … 本人の IdP トークンを呼び出しのたびにソースのトークンへ交換(Entra ID の On-Behalf-Of 等)
# 秘密(client secret・鍵)はこのファイルに書かず、環境変数の名前で参照する(不変条件6)。
# 詳しくは docs/personal-auth.md。
schemaVersion: 1
deployment:
  name: example-credentials
idp:
  adapter:
    kind: keycloak
    baseUrl: http://keycloak:8080
    realm: leisen
    clientId: leisen-gateway
    clientSecretEnv: LEISEN_KEYCLOAK_CLIENT_SECRET
    # ブラウザのログイン(接続ページ・/authorize)で Gateway 自身が得たトークンも検証するため、
    # Gateway の clientId を含める(idp_login_client_not_allowed)
    allowedClients: [leisen-gateway, librechat]
    allowedIssuers: [https://sso.example.com/realms/leisen]
    confirmPlainHttp: true
gateway:
  http:
    host: 0.0.0.0
    confirmExposedHost: true
    port: 8787
    path: /mcp
  # ブラウザ・MCP クライアントから見た Gateway の URL(TLS はリバースプロキシで終端する)
  publicBaseUrl: https://leisen.example.com
  credentials:
    # 暗号文・拒否リストを置く状態 DB(SQLite)。ボリュームに置き、バックアップの対象にする
    store: { kind: sqlite, path: /var/lib/leisen/credentials.db }
    # Token Vault のデータ鍵を包む鍵。local(LEISEN_VAULT_KEY)/ aws_kms / gcp_kms
    keys:
      kind: aws_kms
      keyId: alias/leisen-token-vault
      region: ap-northeast-1
    # ESC・認可コード・state・ブラウザのセッションを封じる鍵の環境変数(既定 LEISEN_ESC_KEY)
    escKeyEnv: LEISEN_ESC_KEY
  authorizationServer:
    enabled: true
    accessTokenTtlSec: 300
    refreshTokenTtlSec: 2592000
    # Orchestrator(leisen-ask serve)の公開 URL。LibreChat はこの受け手のトークンを得て、
    # Orchestrator が RFC 8693 で Gateway 宛てに交換する(ADR-022 決定 10)
    orchestratorResource: https://leisen.example.com/ask/mcp
    clients:
      - clientId: librechat
        name: LibreChat
        redirectUris: ["https://chat.example.com/api/mcp/leisen/oauth/callback"]
        clientSecretEnv: LEISEN_LIBRECHAT_CLIENT_SECRET
        # LibreChat は resource を送らないため、既定の受け手を Orchestrator にする
        defaultResource: https://leisen.example.com/ask/mcp
      - clientId: claude-desktop
        name: MCP クライアント(ループバック)
        redirectUris: ["http://127.0.0.1:33418/callback"]
    allowDynamicRegistration: false
connectors:
  # 既定: Token Vault(どのクライアントからも同じ接続ページで接続する)
  - id: github
    kind: github
    settings: {}
    auth:
      provider: token_vault
      oauth:
        preset: github
        clientId: Iv23liExampleClientId
        clientSecretEnv: LEISEN_GITHUB_APP_SECRET
  # 「本人の資格情報をサーバーに永続化しない」を選ぶソース: ESC
  - id: gdrive
    kind: gdrive
    module: "@leisen/connector-gdrive"
    enabled: false # コネクタは未実装(T-005)。方式の書き方の例
    settings: {}
    auth:
      provider: esc
      oauth:
        preset: google
        clientId: 123456789-example.apps.googleusercontent.com
        clientSecretEnv: LEISEN_GOOGLE_CLIENT_SECRET
        scopes: [https://www.googleapis.com/auth/drive.readonly]
  # IdP トークン方式: Entra ID の On-Behalf-Of(保管しない、接続の操作もない)
  - id: sharepoint
    kind: sharepoint
    module: "@leisen/connector-sharepoint"
    enabled: false # コネクタは未実装。方式の書き方の例
    settings: {}
    auth:
      provider: token_exchange
      exchange:
        kind: entra_obo
        tokenEndpoint: https://login.microsoftonline.com/00000000-0000-0000-0000-000000000000/oauth2/v2.0/token
        clientId: 00000000-0000-0000-0000-000000000001
        clientSecretEnv: LEISEN_ENTRA_CLIENT_SECRET
        scope: https://graph.microsoft.com/.default
audit:
  sink: jsonl
  jsonl:
    path: /var/lib/leisen/audit/audit.jsonl
    rawQueryPath: /var/lib/leisen/rawquery/rawquery.jsonl
