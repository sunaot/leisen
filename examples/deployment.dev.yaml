# deployment.dev.yaml — 手元で Gateway を動かすための開発用設定
#
# README「手元で動かす(5分)」を参照。例:
#   export KP_MOCK_SESSIONS=dev-token=alice          # Bearer トークン → 利用者ID(モックIdP)
#   export KP_MOCK_TOKEN_DEV_DOCS=dev-only-token     # dev-docs に渡す本人資格情報(モック)
#   npx kp-gateway serve --config examples/deployment.dev.yaml
#
# - idp.adapter.kind: mock / auth.provider: mock_env / kind: dev-fixture は
#   いずれも開発専用で、NODE_ENV=production では起動時に拒否される
# - 秘密情報はこのファイルに書かない(不変条件6)。モックのトークンも環境変数で渡す
# - 設定内の相対パスは、このファイルの所在ディレクトリを基準に解決する
#   (起動時のカレントディレクトリには依存しない)
# 本番構成のサンプルは examples/deployment.yaml。
schemaVersion: 1

deployment:
  name: dev-local

idp:
  adapter:
    # 開発用モック。セッション(トークン=利用者ID)は環境変数 KP_MOCK_SESSIONS
    # ("token=userId[,token=userId...]")で渡す
    kind: mock

gateway:
  http:
    host: 127.0.0.1 # ループバックのみで待ち受ける
    port: 8787
    path: /mcp

connectors:
  - id: dev-docs
    # 組み込みの開発用コネクタ(インメモリの合成コーパス)
    kind: dev-fixture
    auth:
      # 本人資格情報は環境変数 KP_MOCK_TOKEN_DEV_DOCS の固定値(開発専用)。
      # 利用者別に変えるときは KP_MOCK_TOKEN_DEV_DOCS__<USERID>
      provider: mock_env
    settings:
      corpusFile: fixtures/dev-corpus.yaml

audit:
  # 監査レコードを標準出力へ JSON で出す(起動ログは標準エラー出力)。開発用
  sink: stdout
  # JSONL ファイルへ追記する場合(昇格判定レポート promotion-report の入力になる):
  # sink: jsonl
  # jsonl:
  #   path: ../var/audit.jsonl # ディレクトリは事前に作成しておく
  #   rawQueryPath: ../var/raw-queries.jsonl
