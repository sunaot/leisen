# deployment.yaml サンプル(T-010、ADR-005)
#
# 導入1件の全構成をこのファイル1枚で表現する(1デプロイ=1社)。
# スキーマの正は packages/gateway/src/config/schema.ts。
# 危険設定(検索層の不正な有効化、fail-open、privateScopes: included 等)は
# 起動時に拒否される。詳細は packages/gateway/src/config/validate.ts。
schemaVersion: 1

deployment:
  name: example-corp

idp:
  adapter:
    kind: keycloak
    # 本番は https。平文 http でループバック以外(内部網のホスト名等)を指す場合は、
    # 経路が閉じた網であることを確認したうえで confirmPlainHttp: true を併記する
    # (なければ idp_plain_http_requires_confirmation で拒否。issue #17)。
    # イントロスペクションの往復には clientSecret と利用者のセッショントークンが載る
    baseUrl: https://idp.example.test
    realm: example
    clientId: kp-gateway
    # 秘密情報はこのファイルに書かない(不変条件6)。環境変数名で参照する
    clientSecretEnv: KP_KEYCLOAK_CLIENT_SECRET
    # トークンの発行先(azp)として受け入れるクライアント ID の許可リスト(必須。issue #16)。
    # 利用者がログインする UI・MCP クライアントを IdP に登録し、ここに列挙する。
    # ["*"] は azp の検証を外す開発専用の逃げ道(NODE_ENV=production では拒否、それ以外は WARNING)
    allowedClients: [kp-chat-ui]
    # aud に clientId(kp-gateway)が含まれることを要求する。IdP 側で Gateway を audience に
    # 加える設定(Keycloak なら audience マッパー)が前提
    requireAudience: true
    # 受け入れる発行者(iss)は既定で <baseUrl>/realms/<realm>。IdP の公開 URL が baseUrl と
    # 異なる(内部のホスト名で呼ぶ等)ときだけ allowedIssuers: [<公開 URL>/realms/<realm>] を書く

connectors:
  - id: gdrive
    enabled: true
    # ソース別のタイムアウト・レート制御(T-003)。Gatewayが適用する。
    # maxRequestsPerMinute 省略時はレート制御なし
    limits:
      timeoutMs: 30000
      maxRequestsPerMinute: 300
    # DM・プライベート領域は既定で検索対象外(ADR-013 §1)。
    # included へ変更する場合は confirmPrivateScopesIncluded: true と
    # 利用規程の整備(docs/usage-policy-template.md)が必須。
    # consent は同意状態の設計(#42)まで起動時に拒否する(ADR-016 追補2 決定6)
    privateScopes: excluded
    searchLayer:
      # 全導入は検索層OFFで開始し、昇格判定レポート(T-014)の証拠に
      # 基づいて有効化する(ADR-006)
      enabled: false
  - id: slack
    enabled: true
    privateScopes: excluded
    searchLayer:
      enabled: false # ADR-014: Slackは原則オンデマンド検索のみ。中央インデックス化しない

gateway:
  # run API(ADR-019)。Orchestrator(kp-ask / kp-ask serve)が run の開始・結果・フィードバックを申告する
  # /runs と、tools/call で申告された runId の検証の設定。秘密は環境変数名だけを書く(不変条件6)。
  # すべて既定値があるため、省略すると下の値になる
  runs:
    # runId の署名鍵(32 バイト以上の乱数を hex / base64 / base64url で)。Gateway だけが持つ。
    # NODE_ENV=production では未設定・短い・開発用の例の値を起動拒否にする(run_signing_key_missing /
    # run_signing_key_invalid / dev_only_in_production)。それ以外では未設定なら起動ごとの一時鍵(WARNING)
    signingKeyEnv: KP_RUN_ID_KEY
    # 鍵の入れ替え用の 1 つ前の鍵(任意)。設定があれば現行と並べて検証に使う(kid で見分ける)
    previousSigningKeyEnv: KP_RUN_ID_KEY_PREVIOUS
    # Orchestrator と共有する資格情報(16 文字以上)。run API と、runId を申告する tools/call に要る。
    # NODE_ENV=production では未設定・開発用の既定値を起動拒否にする
    orchestratorCredentialEnv: KP_ORCHESTRATOR_CREDENTIAL
    # runId の有効期間(秒)。tools/call と finish はこの期間内だけ受ける。Orchestrator の run の上限時間
    # (runTimeoutMs)より長くする
    ttlSec: 900
    # 発行時刻からフィードバックを受ける期間(秒)。既定 7 日
    feedbackWindowSec: 604800
    # /runs の 3 経路すべてにかける上限(threat-model TM-I5 (d))
    limits:
      maxBodyBytes: 65536 # 本文(バイト)。超えたら 413 payload_too_large
      maxQuestionChars: 4000 # 質問の長さ(文字)
      maxCitations: 50 # finish の引用の件数
      maxSearchedSources: 50 # finish の searchedSources の件数
      maxIdChars: 512 # sourceId / documentId の長さ
      maxRequestsPerUserPerMinute: 60 # 利用者ごとの頻度(3 経路の合計)。超えたら 429 rate_limited

orchestrator:
  maxIterations: 6
  costLimitPerQuery: 0.5

audit:
  # 監査レコードを JSONL ファイルへ追記する(ADR-011。at-least-once、fail-closed)。
  # 収集基盤(SIEM 等)への転送はこのファイルを取り込む形で導入先の運用に委ねる。
  # stdout シンクは開発用で、NODE_ENV=production では dev_only_in_production で
  # 起動を拒否される(issue #17)。開発用の例は deployment.dev.yaml
  sink: jsonl
  jsonl:
    path: /var/lib/kp/audit/audit.jsonl
    # 生クエリ原文は保持期間・閲覧経路が異なるため別ファイル(ADR-011 §3)
    rawQueryPath: /var/lib/kp/rawquery/raw-queries.jsonl
  failureMode: fail-closed # 監査レコードを書けないツール呼び出しは失敗させる(ADR-011)
  privateScopeDocIds: hashed # プライベートスコープdocIdはHMACで秘匿化して記録(ADR-013 §2)
  # hashed の HMAC 鍵(デプロイ固有の秘密)を持つ環境変数名。Gateway の run API が引用 docId を不可逆化する
  # のに使う(ADR-019 決定5)。プライベートスコープを持つソースが有効な構成では必須(secret_env_missing)
  docIdHmacKeyEnv: KP_AUDIT_HMAC_KEY
  retentionDays: 365 # 監査ログ本体の保持(ADR-013 §3)
  rawQueryRetentionDays: 30 # 生クエリの短期保持(ADR-011)
  telemetryRetentionDays: 14 # 分離テレメトリ(ADR-011)

chatHistory:
  retentionDays: 90 # ADR-013 §4。エクスポート・共有機能は提供されない
