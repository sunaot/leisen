<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" role="img" aria-labelledby="t1">
  <title id="t1">図1 現状(A)の構造と、壁 C1〜C5 の位置</title>
  <defs>
    <style>
      text { font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", Meiryo, "IPAPGothic", sans-serif; fill: #1f2328; }
      .title { font-size: 18px; font-weight: 700; }
      .h { font-size: 14px; font-weight: 700; }
      .t { font-size: 12.5px; }
      .s { font-size: 11px; fill: #59636e; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
      .warn { font-size: 12px; fill: #cf222e; }
      .orange { fill: #bc4c00; }
      .badge { font-size: 11px; font-weight: 700; fill: #ffffff; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .ctext { font-size: 11.5px; fill: #cf222e; font-weight: 700; }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker>
  </defs>
  <rect width="1000" height="720" rx="10" fill="#ffffff"/>

  <text class="title" x="20" y="34">図1 現状(A)の構造 — 「最終結果を知る者」と「監査を書く権威」が別の箱にある</text>

  <!-- 利用者 -->
  <rect x="20" y="150" width="100" height="64" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
  <text class="h" x="70" y="178" text-anchor="middle">利用者</text>
  <text class="s" x="70" y="198" text-anchor="middle">質問・feedback</text>
  <line x1="120" y1="182" x2="168" y2="182" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- TB2 -->
  <rect x="140" y="60" width="315" height="305" rx="12" fill="#fff8f2" stroke="#bc4c00" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text class="t orange" x="152" y="80" font-weight="700">TB2 の外: 信頼しない側</text>

  <!-- Orchestrator -->
  <rect x="170" y="92" width="270" height="250" rx="8" fill="#ffffff" stroke="#bc4c00" stroke-width="1.5"/>
  <text class="h" x="185" y="115">Orchestrator(kp-ask serve)</text>
  <rect x="185" y="126" width="240" height="36" rx="6" fill="#fff1e5" stroke="#fb8f44"/>
  <text class="t" x="305" y="149" text-anchor="middle">LLM の出力(信頼しない入力)</text>
  <rect x="185" y="168" width="240" height="36" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
  <text class="t" x="305" y="191" text-anchor="middle">探索ループのコード(自社の製品コード)</text>
  <text class="s" x="305" y="222" text-anchor="middle">↑ 入力とコードが同じ箱に同居している(なぜ 3)</text>
  <rect x="185" y="232" width="240" height="50" rx="6" fill="#fff8c5" stroke="#9a6700"/>
  <text class="t" x="305" y="253" text-anchor="middle" font-weight="700">★ 最終結果・引用・confidence</text>
  <text class="t" x="305" y="272" text-anchor="middle">を知っているのはここだけ</text>
  <text class="warn" x="190" y="306">✕ 質問原文: 記録先なし(#22)</text>
  <text class="warn" x="190" y="326">✕ feedback: メモリ内 1,000 件まで(#30)</text>

  <!-- Orchestrator → Gateway -->
  <line x1="440" y1="160" x2="528" y2="160" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
  <text class="mono" x="484" y="151" text-anchor="middle">tools/call</text>
  <text class="mono" x="484" y="178" text-anchor="middle">_meta.runId</text>
  <text class="s" x="484" y="193" text-anchor="middle">= 申告値</text>

  <!-- Gateway -->
  <rect x="530" y="92" width="225" height="250" rx="8" fill="#f3f9ff" stroke="#0969da" stroke-width="1.5"/>
  <text class="h" x="545" y="115">MCP Gateway(信頼する側)</text>
  <rect x="545" y="126" width="195" height="46" rx="6" fill="#ffffff" stroke="#54aeff"/>
  <text class="t" x="642" y="145" text-anchor="middle">API 面 = MCP のツール面だけ</text>
  <text class="mono" x="642" y="163" text-anchor="middle">tools/list · tools/call</text>
  <text class="t" x="545" y="194">認証 · 認可の委譲 · レート制御</text>
  <text class="t" x="545" y="214">ステートレス(仕様 2026-07-28 版)</text>
  <text class="s" x="545" y="229">リクエストをまたぐ状態を持たない</text>
  <rect x="545" y="240" width="195" height="50" rx="6" fill="#ddf4ff" stroke="#0969da"/>
  <text class="t" x="642" y="261" text-anchor="middle" font-weight="700">★ 監査を書く権威</text>
  <text class="t" x="642" y="280" text-anchor="middle">ただし run の結果は知らない</text>
  <text class="s" x="545" y="312">runId は申告をそのまま記録</text>
  <text class="s" x="545" y="328">(実在・所有者は検証していない)</text>

  <!-- C1: 星どうしを結ぶ -->
  <line x1="425" y1="262" x2="545" y2="262" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="4 3" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <circle cx="485" cy="262" r="12" fill="#cf222e"/><text class="badge" x="485" y="266" text-anchor="middle">C1</text>
  <text class="ctext" x="485" y="292" text-anchor="middle">観測点≠権威</text>

  <!-- C2 / C3 バッジ -->
  <circle cx="755" cy="214" r="12" fill="#cf222e"/><text class="badge" x="755" y="218" text-anchor="middle">C2</text>
  <circle cx="755" cy="149" r="12" fill="#cf222e"/><text class="badge" x="755" y="153" text-anchor="middle">C3</text>

  <!-- コネクタ・ソース -->
  <line x1="767" y1="160" x2="808" y2="160" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="810" y="100" width="170" height="112" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
  <text class="h" x="825" y="123">コネクタ</text>
  <text class="mono" x="825" y="145">search / fetch</text>
  <text class="mono" x="825" y="162">list / describe</text>
  <text class="s" x="825" y="184">ツール IF は凍結</text>
  <text class="s" x="825" y="200">(変更には ADR: 不変条件 5)</text>
  <line x1="895" y1="212" x2="895" y2="246" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="810" y="248" width="170" height="60" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
  <text class="h" x="895" y="273" text-anchor="middle">データソース</text>
  <text class="s" x="895" y="293" text-anchor="middle">認可は本人の資格情報で</text>

  <!-- 監査ストア -->
  <text class="h" x="20" y="400">監査ストア(JSONL 追記・索引なし)</text>

  <!-- ボリューム 2 -->
  <line x1="300" y1="342" x2="300" y2="418" stroke="#bc4c00" stroke-width="1.5" marker-end="url(#a)"/>
  <circle cx="300" cy="365" r="12" fill="#cf222e"/><text class="badge" x="300" y="369" text-anchor="middle">C4</text>
  <text class="ctext" x="318" y="385">TB2 の例外として書く(折衷)</text>
  <rect x="150" y="420" width="290" height="104" rx="8" fill="#fff8f2" stroke="#bc4c00" stroke-width="1.5"/>
  <text class="h" x="165" y="444">ボリューム 2: Orchestrator が書く</text>
  <text class="mono" x="165" y="467">kp-answer-runs</text>
  <text class="t" x="165" y="488">AnswerRun JSONL(ADR-018 決定 4)</text>
  <text class="s" x="165" y="508">Gateway の監査は見えない・触れない(TM-I4)</text>

  <!-- ボリューム 1 -->
  <line x1="642" y1="342" x2="642" y2="418" stroke="#0969da" stroke-width="1.5" marker-end="url(#a)"/>
  <text class="s" x="652" y="384">追記</text>
  <rect x="480" y="420" width="300" height="104" rx="8" fill="#f3f9ff" stroke="#0969da" stroke-width="1.5"/>
  <text class="h" x="495" y="444">ボリューム 1: Gateway だけが書く</text>
  <text class="mono" x="495" y="467">kp-audit / kp-rawquery</text>
  <text class="t" x="495" y="488">ToolInvocation JSONL(runId は申告値)</text>
  <text class="t" x="495" y="508">生クエリ表(30 日)= search の引数だけ</text>

  <!-- レポート -->
  <rect x="820" y="420" width="160" height="104" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
  <text class="h" x="900" y="444" text-anchor="middle">昇格判定レポート</text>
  <text class="mono" x="900" y="467" text-anchor="middle">--audit ×2</text>
  <text class="s" x="900" y="488" text-anchor="middle">(runId, userId) で</text>
  <text class="s" x="900" y="504" text-anchor="middle">事後に突合する</text>
  <line x1="780" y1="472" x2="818" y2="472" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
  <polyline points="295,524 295,556 900,556 900,526" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
  <circle cx="820" cy="420" r="12" fill="#cf222e"/><text class="badge" x="820" y="424" text-anchor="middle">C5</text>

  <!-- 凡例 -->
  <line x1="20" y1="580" x2="980" y2="580" stroke="#d0d7de"/>
  <g>
    <circle cx="34" cy="603" r="10" fill="#cf222e"/><text class="badge" x="34" y="607" text-anchor="middle">C1</text>
    <text class="t" x="52" y="607"><tspan font-weight="700">観測点 ≠ 権威</tspan> — AnswerRun の中身は本質的に Orchestrator の申告。ただし runId・userId・引用 docId の実在は検証できる余地がある</text>
    <circle cx="34" cy="628" r="10" fill="#cf222e"/><text class="badge" x="34" y="632" text-anchor="middle">C2</text>
    <text class="t" x="52" y="632"><tspan font-weight="700">ステートレス vs run のライフサイクル</tspan> — run は複数リクエストにまたがるが、状態の置き場が決まっていない</text>
    <circle cx="34" cy="653" r="10" fill="#cf222e"/><text class="badge" x="34" y="657" text-anchor="middle">C3</text>
    <text class="t" x="52" y="657"><tspan font-weight="700">ツール IF の凍結 vs 新しい事象</tspan> — 外に見せる面がツールだけなので、run_finished を足すとコネクタ IF と混ざる</text>
    <circle cx="34" cy="678" r="10" fill="#cf222e"/><text class="badge" x="34" y="682" text-anchor="middle">C4</text>
    <text class="t" x="52" y="682"><tspan font-weight="700">単純さ vs TB2 の厳格さ</tspan> — 字義どおりなら Orchestrator は何も書けない。緩めた結果が「別ボリュームに書く」折衷</text>
    <circle cx="34" cy="703" r="10" fill="#cf222e"/><text class="badge" x="34" y="707" text-anchor="middle">C5</text>
    <text class="t" x="52" y="707"><tspan font-weight="700">JSONL 追記 = 索引なし</tspan> — runId の所有者・引用の実在は、書き込み時には検証できず、レポート時にしか突合できない</text>
  </g>
</svg>
