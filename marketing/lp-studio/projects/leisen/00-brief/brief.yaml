project_name: "leisen-oss-lp"
conversion_action: "導入相談/デザインパートナー応募(一次CV)。二次CV: GitHubリポジトリ閲覧・ドキュメント閲覧"
primary_target: "従業員数百〜数千人規模の日本企業で、生成AIの社内活用と情報統制の両方に責任を持つ人。具体的には情報システム部門長・CTO/VPoE・DX推進責任者、および導入を技術評価するセキュリティ/インフラエンジニア"
target_context: "社内ナレッジがGoogle Drive / Slack / GitHub / wiki等の複数SaaSに分散している。生成AIを社内情報に接続したい圧力(経営・現場)がある一方、アクセス権限の逸脱・情報漏洩・監査不能への懸念、およびSaaS型AI検索製品に全社データを預けることへの抵抗があり、意思決定が止まりがち"
traffic_source: "organic(技術記事・GitHub・カンファレンス・紹介)を想定。広告運用は未定"
ad_promise: "unknown(広告未運用。LP単体で文脈を自給する必要がある)"
market: "ja-JP"
primary_device: "desktop"
constraints:
  - "導入実績・顧客ロゴ・定量成果は現時点で存在しない。創作禁止(Claim Ledgerにない実績を書かない)"
  - "プロダクト名・商標は未確定(人間タスク)。LPでは『Leisen(仮称)』をプレースホルダとして使用"
  - "SaaS提供はしない。OSS + 各社シングルテナント導入 + 導入支援が提供形態"
  - "ライセンスはApache-2.0推奨だが最終決定前(ADR-004)。断定表記しない"
  - "OSS公開時期は再検討中(v3 §8)。公開前提の断定表記を避ける"
open_questions:
  - "正式プロダクト名・ドメイン"
  - "広告運用の有無とチャネル"
  - "デザインパートナー募集条件(無償支援と引き換えの要件・評価データ提供)の公開可否"
  - "問い合わせフォームの送信先・運用体制"
