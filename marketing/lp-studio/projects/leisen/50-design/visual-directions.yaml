# Stage 8 ビジュアルコミュニケーション3方向(arch-1 × Hero v3)
# 3案は色違いではなく、視覚アンカーと伝達機構が異なる
directions:
  - dir_id: dir-1
    name: "図面(Blueprint)"
    visual_anchor: "アーキテクチャ図が全ページの背骨。Heroの一枚図が各セクションで部分拡大され、方式(権限判定の所在)を図で語り続ける"
    attention_hierarchy: "図 → 見出し → 注記(モノスペース)。読者の目を常に図のフローに戻す"
    typography_role: "IBM Plex Sans JP(本文/見出し)+IBM Plex Mono(図注・設定例)。技術文書の正確さをトーンとして流用"
    imagery_role: "SVG構成図・deployment.yaml断片・ADR見出しの引用 = 『方式が実在する』ことの証拠。装飾画像なし"
    density_whitespace: "工学ドキュメント的。余白は図の周囲に集中、テキストは65字幅"
    motion: "なし(スクロールで図の該当部がハイライトする程度、reduced-motion尊重)"
    category_relation: "抽象グラデーション+AIモチーフ(カテゴリノイズ)を意図的に拒否。Keycloak/Oxide系の『実在感』路線"
    differentiated: "ws-01(方式開示)を視覚言語そのものにする。競合の誰も図面をヒーローにしていない"
    why_target_trusts: "情シス/評価エンジニアは装飾より構成図を信頼する(findings-c: 実UI/実物系が信頼装置)"
    imitation_risk: "低(Dashworks比較表とは異なる文法)"
    implementation_cost: "中(SVG図の作り込み)"
  - dir_id: dir-2
    name: "監査台帳(Ledger)"
    visual_anchor: "監査ログの台帳(誰が・どのソースに・何を・結果)がヒーロービジュアル。ページ全体が公文書/稟議文書の組版"
    attention_hierarchy: "台帳 → 明朝の見出し → 審査観点の対応表(sec5)がページの中心"
    typography_role: "Shippori Mincho(見出し=公文書の重み)+Noto Sans JP(本文)+IBM Plex Mono(台帳)"
    imagery_role: "台帳・対応表・『できないこと』一覧 = 説明責任の視覚化。承認印風のバッジは placeholder のDP募集のみ"
    density_whitespace: "国内conv-06(縦長1枚・稟議転記可能)を意図的に踏襲。情報密度高め、罫線で整理"
    motion: "なし"
    category_relation: "国内B2B LPの型に従いつつ、ロゴ帯・数値バッジ(持っていない証明)を台帳と対応表で置換"
    differentiated: "ws-02(監査可能性)を視覚言語化。『そのまま社内説明に使える』を紙面設計で実装"
    why_target_trusts: "稟議・審査を書く人の実務文書と同じ文法で語る"
    imitation_risk: "低"
    implementation_cost: "低〜中"
  - dir_id: dir-3
    name: "実演(同じ質問、違う答え)"
    visual_anchor: "2人の利用者が同じ質問をして、権限に応じて異なる答えを得るチャットUIの並置デモ。権限透過を『結果』で見せる"
    attention_hierarchy: "デモUI → 差分(見える/見えない)→ 見出し。製品体験の疑似提供"
    typography_role: "Zen Kaku Gothic New(見出し/本文)+M PLUS 1 Code(UIテキスト)。プロダクトUI主導"
    imagery_role: "チャットモック=約束の実演(『見えるのは本人に権限がある情報だけ』の視覚証明)。すべて架空データと明記"
    density_whitespace: "モダンSaaS型。ダークUIパネル+広い余白"
    motion: "デモ内のみ最小限(タイプ表示風。reduced-motionでは静止)"
    category_relation: "conv-08の実UI路線。ただし見せるのは機能一覧でなく権限差分という一点"
    differentiated: "競合は『何でも見つかる』を見せる。当方向は『見えないものがある』ことを見せる(逆張りの実演)"
    why_target_trusts: "『権限外は見えない』の抽象的約束を、目で確認できる形にする"
    imitation_risk: "中(チャットUIモック自体はカテゴリ頻出。差分並置が固有性)"
    implementation_cost: "中"
notes:
  - "3方向ともコピーはHero v3+arch-1のセクション文(共通)。実績・数値クレームは置かない"
  - "モックデータはすべて架空であることをページ内に明記(創作実績と誤認させない)"
